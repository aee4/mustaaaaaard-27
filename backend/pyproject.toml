[project]
name = "mustaaaaaard-backend"
version = "0.1.0"
description = "Mustaaaaaard ’27 — The Final Season. Private sharing backend."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "authlib>=1.5,<2", "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3", "boto3>=1.37,<2", "pillow>=11.1,<13",
  "python-multipart>=0.0.20,<1", "typer>=0.15,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-boto3[s3]>=1.37,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "storage: requires real S3/MinIO", "video: requires FFmpeg"]
