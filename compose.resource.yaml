# Isolated local test stack. Never use this development authentication in production.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mustard
      POSTGRES_PASSWORD: mustard-test-only
      POSTGRES_DB: mustard_resource_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mustard -d mustard_resource_test"]
      interval: 3s
      retries: 20
  storage:
    build:
      context: ./backend
      dockerfile: docker/minio.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: mustard-local
      MINIO_ROOT_PASSWORD: mustard-local-password
  storage-init:
    build: ./backend
    environment:
      ENVIRONMENT: test
      S3_ENDPOINT: http://storage:9000
    command: ["uv", "run", "--no-sync", "python", "-m", "scripts.init_storage"]
    depends_on: [storage]
  app:
    build: .
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.1
    ports: ["127.0.0.1:58001:10000"]
    environment:
      ENVIRONMENT: test
      DEV_AUTH: "true"
      COOKIE_SECURE: "false"
      BASE_URL: http://127.0.0.1:58001
      ALLOWED_ORIGINS: '["http://127.0.0.1:58001"]'
      DATABASE_URL: postgresql+psycopg://mustard:mustard-test-only@postgres:5432/mustard_resource_test
      S3_ENDPOINT: http://storage:9000
      RUN_RELEASE_ON_START: "true"
      MEDIA_CONCURRENCY: "1"
      FFMPEG_THREADS: "1"
      STORAGE_QUOTA_BYTES: "8000000000"
      STORAGE_OBJECT_QUOTA: "10000"
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
